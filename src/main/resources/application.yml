server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: pos-inventory-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:pos_user}
    password: ${DB_PASSWORD:pos_pass}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.OracleDialect}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      continue-on-error: true

# JWT Configuration
jwt:
  # Base64 encoded 256-bit key or raw secret of at least 32 bytes
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # 120 minutes in milliseconds = 120 * 60 * 1000 = 7,200,000 ms
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}

# Rate Limiting Configuration (Bucket4j)
app:
  rate-limiting:
    enabled: true
    capacity: 100
    refill-tokens: 100
    refill-duration-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
